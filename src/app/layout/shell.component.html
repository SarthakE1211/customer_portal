<!-- Header: logo and version, navigation, search, profile. -->
<header class="top">
  <a routerLink="/dashboard" class="brand" aria-label="Vantage home">
    <img src="assets/Vantage_Logo.png" alt="Vantage">
    <span class="ver">V{{ version }}</span>
  </a>
  <span class="divider hide-sm"></span>
  <nav class="nav">
    <a routerLink="/dashboard" routerLinkActive="on">Dashboard</a>
    <a routerLink="/work-orders" routerLinkActive="on">Work orders</a>
    <a routerLink="/reports" routerLinkActive="on">Reports</a>
  </nav>

  <div class="right">
    <form class="search hide-sm" (ngSubmit)="runSearch()" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#79808C" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" name="q" [(ngModel)]="search" placeholder="Search tickets, cities…" aria-label="Search work orders">
    </form>
    <button class="profile" type="button" (click)="openProfile()" [class.open]="drawerOpen" aria-label="Open profile">
      <span class="avatar">{{ initials }}</span>
      <span class="who hide-sm">
        <b>{{ session.session?.name || session.session?.email }}</b>
        <small>{{ (customerName$ | async) || 'Customer Side User' }}</small>
      </span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#79808C" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</header>

<router-outlet></router-outlet>

<cp-profile-drawer *ngIf="drawerOpen" (closed)="drawerOpen = false"></cp-profile-drawer>
